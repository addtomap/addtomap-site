# Claude Code review of every non-draft PR (one sticky comment + inline comments, read-only), and
# "@claude …" in a PR comment for questions or fixes pushed to the PR branch.
# Needs the ANTHROPIC_API_KEY secret; without it both jobs skip with a notice instead of failing,
# so this check stays optional in branch protection.
name: claude-review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  auto-review:
    name: claude-review
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Is the API key configured?
        id: key
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY is not set — Claude review skipped (README → CI/CD)"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.key.outputs.enabled == 'true'
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        if: steps.key.outputs.enabled == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          use_sticky_comment: true
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a pull request for addtomap.co, the static marketing site of AddToMap
            (an iOS app of offline audio walking tours). Plain HTML/CSS/vanilla JS served by GitHub
            Pages: index.html (landing, inline CSS/JS, the I18N table for six languages), tour pages
            t/<slug>/index.html, privacy.html, impressum.html, assets in img/, audio/, video/.
            The PR branch is checked out in the working directory.

            Review the diff (`gh pr diff`), most important first:

            1. Correctness: broken links or asset paths, JS errors, language switching (every
               data-i18n key in en, de, fr, es, it, ru; localized screenshots, hero video and
               previews switch with the picker), preview playback, mobile layout.
            2. Truthfulness of marketing copy: prices, tour lengths, stop counts and narration
               languages must match the app (narration en/de/fr/ru for all tours, Rome also es; no
               Italian narration; first three stops of paid tours free; no subscription). No claims
               the app does not deliver, no fake reviews.
            3. Privacy and legal (German site): no third-party requests (fonts, analytics, embeds)
               without a consent mechanism and a privacy.html update; Impressum stays complete.
            4. Accessibility and SEO: alt texts, button types, contrast, lang attribute, titles,
               og:/canonical tags on tour pages, sitemap.xml in sync.
            5. Performance: image/video sizes within the budgets in scripts/check-site.mjs,
               loading="lazy" below the fold, no render-blocking additions.
            6. Tests: user-visible behavior changes need a Playwright test in tests/; new assets or
               pages need scripts/check-site.mjs to cover them.

            Be concrete and brief. Skip praise and style nits. For each finding give file:line,
            why it matters, and the fix. If nothing is wrong, say so in one line. Finish with
            "Verdict: approve" or "Verdict: request changes".

            Use `gh pr comment` for the summary (one comment, updated in place) and
            `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) for
            specific lines. Only post GitHub comments — do not output the review as plain text.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(git log:*),Bash(git diff:*),Bash(node scripts/check-site.mjs)"

  mention:
    name: claude-mention
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Is the API key configured?
        id: key
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY is not set — @claude ignored"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.key.outputs.enabled == 'true'
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        if: steps.key.outputs.enabled == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: "@claude"
          claude_args: |
            --append-system-prompt "addtomap.co is a static GitHub Pages site (index.html with inline CSS/JS and the six-language I18N table; tour pages t/<slug>/; assets in img/, audio/, video/). Every user-visible string needs en/de/fr/es/it/ru; marketing claims must match the app; no third-party requests; keep sitemap.xml and the tour pages in sync. Before pushing run: npm ci && npm test (static checks, html-validate, Playwright in Chrome)."
