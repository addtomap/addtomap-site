# External links (Instagram/TikTok/YouTube, App Store, sources) can break without any change here,
# so they are checked weekly instead of on every PR. Internal links are covered by ci / static.
name: links

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  external-links:
    name: external links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-retries 3 --timeout 20
            --accept 200,206,429,999
            --exclude '^addtomap://' --exclude '^mailto:' --exclude 'addtomap\.co'
            index.html privacy.html impressum.html 't/*/index.html'
          fail: false
      - name: Open or update an issue when links are broken
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Broken external links on addtomap.co"
          num="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')"
          if [ -n "$num" ]; then gh issue comment "$num" --body-file lychee/out.md
          else gh issue create --title "$title" --body-file lychee/out.md; fi
