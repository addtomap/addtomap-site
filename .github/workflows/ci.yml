# Checks for every pull request and every push to main. Required in branch protection:
# "static" and "e2e". "lighthouse" reports scores and fails on accessibility / best practices / SEO
# below 0.9 (performance only warns). Local equivalents: npm test (see README).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Site checks (links, i18n, localized assets, tour pages, sitemap, sizes, secrets)
        run: npm run check
      - name: HTML validation
        run: npm run lint:html

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Tests run in Google Chrome (preinstalled on ubuntu runners): Playwright's Chromium cannot
      # decode the H.264 hero loops and MP3 previews.
      - run: google-chrome --version
      - name: Playwright (desktop + mobile)
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  lighthouse:
    name: lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
